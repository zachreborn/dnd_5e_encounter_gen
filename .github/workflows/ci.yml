name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        include:
          - python: "3.15"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.os }}-python-${{ matrix.python }}
      - name: Install development tools
        run: uv sync --locked
      - name: Unit tests, catalog integrity and branch coverage
        run: |
          uv run --locked python -B -m coverage run -m unittest discover -s tests -v
          uv run --locked python -B -m coverage report
      - name: Lint and whitespace
        run: |
          uv run --locked ruff check .
          git diff --check
      - name: Separate subprocess smoke suite
        run: uv run --locked python -B -m unittest discover -s tests/smoke -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean installed-artifact and offline runtime smoke checks
        run: uv run --locked python -B tools/check_distribution.py dist/*.whl dist/*.tar.gz
