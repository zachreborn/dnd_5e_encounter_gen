[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd_5e_encounter_gen"
dynamic = ["version"]
description = "Offline revised fifth-edition encounter generator with customizable JSON catalogs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Zachary Hill"}]
license-files = ["dnd_5e_encounter_gen/NOTICE.txt"]

[project.urls]
Repository = "https://github.com/zachreborn/dnd_5e_encounter_gen"

[project.scripts]
dnd-encounter = "dnd_5e_encounter_gen.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "coverage>=7.6,<8", "ruff>=0.9,<1", "jsonschema>=4.23,<5"]

[tool.setuptools]
packages = ["dnd_5e_encounter_gen", "dnd_5e_encounter_gen.data"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "dnd_5e_encounter_gen.__version__"}

[tool.setuptools.package-data]
dnd_5e_encounter_gen = ["data/*.json", "NOTICE.txt"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["dnd_5e_encounter_gen"]
omit = ["*/__main__.py", "*/random_encounter_builder.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
